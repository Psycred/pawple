# Pawple Supabase CLI config (PAW-20 / A3).
# Used for `supabase db push`, `supabase db reset`, and migration verification.
# See docs/SUPABASE_DB_RECREATE.md for environment-specific workflows.

project_id = "pawple"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
enabled = true

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"

[storage]
enabled = true
